name: Release preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FujiPhotoRenamer.lrplugin/Info.lua'
      - 'CHANGELOG.md'
      - 'scripts/release.mjs'
      - 'scripts/package.mjs'
      - 'scripts/packaging.mjs'
      - 'tests/release_test.mjs'
      - 'scripts/verify-windows-release.py'
      - 'tests/windows_release_test.py'
      - '.github/workflows/release*.yml'
  push:
    branches: [main]
    paths:
      - 'src/FujiPhotoRenamer.lrplugin/Info.lua'
      - 'CHANGELOG.md'
      - 'scripts/release.mjs'
      - 'scripts/package.mjs'
      - 'scripts/packaging.mjs'
      - 'tests/release_test.mjs'
      - 'scripts/verify-windows-release.py'
      - 'tests/windows_release_test.py'
      - '.github/workflows/release*.yml'

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify actual repository version, release notes and asset guards
        run: node --test tests/release_test.mjs

  windows-bundle:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and exercise the actual Windows bundle
        env:
          PYTHONUTF8: '1'
        shell: pwsh
        run: |
          python tests/windows_release_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-exiftool.mjs --platform windows --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package.mjs --platform windows --python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = @(Get-ChildItem dist/*-windows.zip)
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows ZIP' }
          python scripts/verify-windows-release.py $archive[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
