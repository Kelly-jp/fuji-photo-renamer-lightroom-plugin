name: Release preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FujiPhotoRenamer.lrplugin/Info.lua'
      - 'CHANGELOG.md'
      - 'scripts/release.mjs'
      - 'scripts/package.mjs'
      - 'scripts/packaging.mjs'
      - 'tests/release_test.mjs'
      - '.github/workflows/release*.yml'
  push:
    branches: [main]
    paths:
      - 'src/FujiPhotoRenamer.lrplugin/Info.lua'
      - 'CHANGELOG.md'
      - 'scripts/release.mjs'
      - 'scripts/package.mjs'
      - 'scripts/packaging.mjs'
      - 'tests/release_test.mjs'
      - '.github/workflows/release*.yml'

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify actual repository version, release notes and asset guards
        run: node --test tests/release_test.mjs
